name: Review reference updates
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detect-and-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: pip install -r requirements-reference.txt
      - run: python scripts/check_for_reference_updates.py --manifest-url https://mariano-aguilar-vela.github.io/mycn-isoform-viewer/data/current/manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reference-update-review
          path: |
            reference-update-report.json
            reference-update-candidate/
